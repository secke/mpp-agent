global:
  scrape_interval: 15s

scrape_configs:
  - job_name: mpp-server
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["server:8787"]

  # Agent: ephemeral process. The target goes "down" outside runs; the
  # series stays queryable in history (see docs/features/observability.md).
  - job_name: mpp-agent
    metrics_path: /metrics
    scrape_interval: 10s
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["agent:9464"]
