# MPP provider + Prometheus (+ agent on demand).
# Secrets come from the host environment / a .env file passed to
# `docker compose` — never from the image (see Dockerfile, .dockerignore).
#   docker compose up -d --build
#   docker compose --profile agent run --rm --use-aliases agent "your question"

services:
  server:
    build: .
    environment:
      MPP_SECRET_KEY: ${MPP_SECRET_KEY:?MPP_SECRET_KEY required}
      MPP_RECIPIENT: ${MPP_RECIPIENT:?MPP_RECIPIENT required}
      MPP_REALM: ${MPP_REALM:-localhost}
      MPP_NETWORK: testnet
      PORT: "8787"
      LEDGER_PATH: /app/data/ledger.sqlite
      REPLAY_STORE: sqlite
      REPLAY_STORE_PATH: /app/data/replay.sqlite
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN required (>= 16 chars)}
    volumes:
      - server-data:/app/data
    ports:
      - "127.0.0.1:8787:8787"   # exposed locally only
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    secrets:
      - metrics_token
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      server:
        condition: service_healthy

  agent:
    profiles: ["agent"]
    build: .
    entrypoint: ["node", "--import", "tsx", "agent/index.ts"]
    environment:
      AGENT_PROVIDER_URL: http://server:8787
      AGENT_PRIVATE_KEY: ${AGENT_PRIVATE_KEY:-}
      MPP_NETWORK: testnet
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # Prometheus export: the agent serves /metrics during the run, then keeps it up.
      AGENT_METRICS_PORT: "9464"
      AGENT_METRICS_LINGER: ${AGENT_METRICS_LINGER:-45}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN required (>= 16 chars)}
    depends_on:
      server:
        condition: service_healthy

secrets:
  # Same token as the server's; Prometheus reads it from a file.
  metrics_token:
    environment: METRICS_TOKEN

volumes:
  server-data:
