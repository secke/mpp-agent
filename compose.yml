# Provider MPP + Prometheus (+ agent à la demande).
# Les secrets viennent de l'environnement de l'hôte / d'un fichier .env passé
# à `docker compose` — jamais de l'image (voir Dockerfile, .dockerignore).
#   docker compose up -d --build
#   docker compose --profile agent run --rm agent "ta question"

services:
  server:
    build: .
    environment:
      MPP_SECRET_KEY: ${MPP_SECRET_KEY:?MPP_SECRET_KEY requis}
      MPP_RECIPIENT: ${MPP_RECIPIENT:?MPP_RECIPIENT requis}
      MPP_REALM: ${MPP_REALM:-localhost}
      MPP_NETWORK: testnet
      PORT: "8787"
      LEDGER_PATH: /app/data/ledger.sqlite
      REPLAY_STORE: sqlite
      REPLAY_STORE_PATH: /app/data/replay.sqlite
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN requis (>= 16 car.)}
    volumes:
      - server-data:/app/data
    ports:
      - "127.0.0.1:8787:8787"   # exposé en local uniquement
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    secrets:
      - metrics_token
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      server:
        condition: service_healthy

  agent:
    profiles: ["agent"]
    build: .
    entrypoint: ["node", "--import", "tsx", "agent/index.ts"]
    environment:
      AGENT_PROVIDER_URL: http://server:8787
      AGENT_PRIVATE_KEY: ${AGENT_PRIVATE_KEY:-}
      MPP_NETWORK: testnet
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # Export Prometheus : l'agent sert /metrics pendant le run puis le maintient.
      AGENT_METRICS_PORT: "9464"
      AGENT_METRICS_LINGER: ${AGENT_METRICS_LINGER:-45}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN requis (>= 16 car.)}
    depends_on:
      server:
        condition: service_healthy

secrets:
  # Même jeton que celui du serveur ; Prometheus le lit en fichier.
  metrics_token:
    environment: METRICS_TOKEN

volumes:
  server-data:
